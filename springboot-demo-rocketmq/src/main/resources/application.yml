# v5版本 rocketmq配置
rocketmq:
  producer:
    endpoints: 10.1.1.72:18081
    # 开启acl后的账号密码
    access-key: rocketmq
    secret-key: 12345678
#  消费者配置
  simple-consumer:
    endpoints: 10.1.1.72:18081
    # 开启acl后的账号密码
    access-key: rocketmq
    secret-key: 12345678
    consumer-group: rocketmq-consumer-local-group
    tag: "*"

demo:
  acl:
    rocketmq:
      endpoints: "10.1.1.72:18081"
      topic: "normalTopic"
      consumer-group: "normalGroup"
      access-key: "rocketmq"
      secret-key: "12345678"
      tag: "*"
      consumptionThreadCount: 32